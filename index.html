<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prévision journalière BOENY</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1DB8F23ZD3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-1DB8F23ZD3');
  </script>
</head>
<body>
  <header id="header">
    <div id="date-time"></div>
    <div id="alert-status">Situation normale</div>
    <div id="logo-container">
      <a class="admin-access" href="./admin/" aria-label="Administration" title="Administration">⚙</a>
      <img id="alert-icon" class="alert-icon" src="icon-warning-generic-yellow.png" alt="Alerte" />
      <img id="logo" src="logo-meteo.png" alt="Logo" />
    </div>
  </header>

  <main id="app-shell">
    <section id="slide" aria-live="polite">
      <div id="image-container">
        <img src="Fond_rq.png" class="alert-image" alt="Bulletin météo" />
      </div>
      <aside id="message-panel">
        <div id="slide-title">Prévisions journalières BOENY</div>
        <div id="message"></div>
        <div id="slide-meta">
          <div id="slide-counter">0 / 0</div>
          <div id="slide-dots" aria-hidden="true"></div>
          <div id="slide-controls">
            <button id="prev-slide" class="control-button" type="button" aria-label="Slide précédente">‹</button>
            <button id="next-slide" class="control-button" type="button" aria-label="Slide suivante">›</button>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <script src="./assets/js/script.js"></script>

  <div id="footer">By SRM BOENY, 2025</div>
</body>
</html>
